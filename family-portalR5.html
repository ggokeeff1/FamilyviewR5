  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#51BF9D,#005D63);color:#fff;font:600 19px Prompt,sans-serif;display:flex;align-items:center;justify-content:center\">NC<\u002Fdiv>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ togglePhoto }}\" title=\"{{ photoCta }}\" aria-label=\"{{ photoCta }}\" style=\"position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:#51BF9D;color:#fff;cursor:pointer;font:500 14px Prompt,sans-serif;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 2px rgba(19,56,75,.2)\">+<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"min-width:0\">\n          <div style=\"font:600 21px Prompt,sans-serif;letter-spacing:-.3px\">Noreen Curtin<\u002Fdiv>\n          <div style=\"display:flex;gap:16px;font-size:14px;color:#666D89;margin-top:5px;flex-wrap:wrap\">\n            <span>ID 75688<\u002Fspan><span>DOB 04/03/1941<\u002Fspan><span>Tullamore branch<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-left:auto;flex-wrap:wrap\">\n          <span style=\"font-size:13px;font-weight:700;color:#005D63;background:rgba(81,191,157,.10);border:1px solid rgba(81,191,157,.35);padding:3.5px 10px;border-radius:20px;white-space:nowrap\">● Active<\u002Fspan>\n          <span style=\"font-size:13px;font-weight:700;color:#005D63;background:rgba(81,191,157,.10);border:1px solid rgba(81,191,157,.35);padding:3.5px 10px;border-radius:20px;white-space:nowrap\">Care Plan Approved · 26/08/2026<\u002Fspan>\n          <span style=\"font-size:13px;font-weight:700;color:#666D89;background:#eef1f2;border:1px solid #e6eaec;padding:3.5px 10px;border-radius:20px;white-space:nowrap\">E-Signature: Fully Signed<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ editingPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:18px;border:1px solid #e6eaec;border-radius:14px;background:#f4f6f7;padding:18px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap\">\n          <div style=\"width:120px;height:120px;flex:none;border-radius:14px;border:2px dashed #cfdadf;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden\">\n            <sc-if value=\"{{ draftPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n              {{ draftImg }}\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noDraftPhoto }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"font-size:12.5px;color:#666D89;text-align:center;padding:0 10px\">No photo yet<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"min-width:200px;flex:1;max-width:520px\">\n            <div style=\"font:600 16px Prompt,sans-serif;margin-bottom:6px\">Photo of Noreen<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.55;color:#666D89\">Choose a photo from your phone or computer. Any size is fine — it is scaled down and cropped to a square automatically.<\u002Fdiv>\n            <label style=\"display:inline-flex;align-items:center;gap:8px;margin-top:13px;border:1px solid #e6eaec;background:#fff;cursor:pointer;font:500 14.7px Prompt,sans-serif;padding:9px 16px;border-radius:9px;color:#005D63\">\n              <span>{{ chooseLabel }}<\u002Fspan>\n              <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ onPhotoFile }}\" style=\"display:none\">\n            <\u002Flabel>\n            <div style=\"display:flex;gap:9px;margin-top:14px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ donePhoto }}\" style=\"border:none;cursor:pointer;background:#51BF9D;color:#fff;font:500 14.7px Prompt,sans-serif;padding:9px 16px;border-radius:9px\">Done<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ cancelPhoto }}\" style=\"border:1px solid #e6eaec;background:#fff;cursor:pointer;font:500 14.7px Prompt,sans-serif;padding:9px 16px;border-radius:9px;color:#13384B\">Cancel<\u002Fbutton>\n              <sc-if value=\"{{ hasPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ usInitials }}\" style=\"border:1px solid #e6eaec;background:#fff;cursor:pointer;font:500 14.7px Prompt,sans-serif;padding:9px 16px;border-radius:9px;color:#666D89\">Show initials instead<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ photoHint }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:13.5px;color:#b6650f;font-weight:600;margin-top:11px\">{{ photoHint }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <nav style=\"display:flex;gap:26px;margin-top:20px;flex-wrap:wrap\">\n        <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ tab.go }}\" style=\"border:none;background:none;cursor:pointer;font:600 15px Prompt,sans-serif;padding:0 2px 14px;color:{{ tab.fg }};border-bottom:3px solid {{ tab.bd }};display:flex;align-items:center;gap:8px;white-space:nowrap\">\n            <span>{{ tab.label }}<\u002Fspan>\n            <sc-if value=\"{{ tab.count }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font:700 11px Prompt,sans-serif;background:rgba(81,191,157,.10);color:#005D63;padding:2px 8px;border-radius:20px\">{{ tab.count }}<\u002Fspan><\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <main class=\"gutter\" style=\"flex:1;padding:24px 26px 60px\">\n   <div style=\"max-width:1320px;margin:0 auto\">\n\n    <sc-if value=\"{{ isUpdates }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"two-col\" style=\"display:grid;grid-template-columns:minmax(0,1.75fr) minmax(260px,1fr);gap:20px;align-items:start\">\n        <div st play:flex;align-items:center;gap:11px;min-width:0\">\n                <div style=\"width:28px;height:28px;border-radius:7px;background:#fdecea;color:#c0554a;font:700 9px Prompt,sans-serif;display:flex;align-items:center;justify-content:center;flex:none\">PDF<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ d.name }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:14px;color:#666D89\">{{ d.date }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:#666D89\">{{ d.size }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:#666D89;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ d.by }}<\u002Fdiv>\n              <div style=\"display:flex;gap:7px\">\n                <button style=\"border:1px solid #e6eaec;background:#fff;cursor:pointer;font:500 13.8px Prompt,sans-serif;padding:7px 12px;border-radius:8px;color:#005D63\">View<\u002Fbutton>\n                <button style=\"border:1px solid #e6eaec;background:#fff;cursor:pointer;font:500 13.8px Prompt,sans-serif;padding:7px 12px;border-radius:8px;color:#005D63\">Download<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPeople }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"two-col\" style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:20px;align-items:start\">\n        <section style=\"background:#fff;border:1px solid #e6eaec;border-radius:14px;box-shadow:0 1px 2px rgba(19,56,75,.04);padding:22px;min-width:0\">\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px\">\n            <div style=\"font:600 17px Prompt,sans-serif\">Who can see this portal<\u002Fdiv>\n            <span style=\"font-size:12.2px;font-weight:600;color:#666D89;background:#eef1f2;border:1px solid #e6eaec;padding:4px 10px;border-radius:20px;white-space:nowrap\">You are the nominated person<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 18px;font-size:14px;line-height:1.55;color:#666D89;max-width:620px\">Access is granted by name. Only people listed here can open Noreen's portal, and the care coordinator is notified of every change.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column\">\n            <sc-for list=\"{{ members }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #e6eaec;flex-wrap:wrap\">\n                <div style=\"width:38px;height:38px;border-radius:50%;background:{{ m.avBg }};color:#fff;font:600 13px Prompt,sans-serif;display:flex;align-items:center;justify-content:center;flex:none\">{{ m.initials }}<\u002Fdiv>\n                <div style=\"min-width:150px;flex:1\">\n                  <div style=\"font-size:15px;font-weight:700\">{{ m.name }}<\u002Fdiv>\n                  <div style=\"font-size:13px;color:#666D89;margin-top:2px\">{{ m.rel }} · {{ m.notif }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:12.2px;font-weight:600;padding:3.5px 10px;border-radius:20px;background:#eef1f2;color:#666D89;white-space:nowrap\">{{ m.level }}<\u002Fspan>\n                <span style=\"font-size:12.2px;font-weight:600;padding:3.5px 10px;border-radius:20px;background:{{ m.bg }};color:{{ m.fg }};white-space:nowrap\">{{ m.status }}<\u002Fspan>\n                <button style=\"border:1px solid #e6eaec;background:#fff;cursor:pointer;font:500 13.8px Prompt,sans-serif;padding:7px 12px;border-radius:8px;color:#666D89;white-space:nowrap\">Manage<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div style=\"display:flex;flex-direction:column;gap:20px;min-width:0\">\n          <section style=\"background:#fff;border:1px solid #e6eaec;border-radius:14px;box-shadow:0 1px 2px rgba(19,56,75,.04);padding:22px\">\n            <div style=\"font:600 16px Prompt,sans-serif;margin-bottom:6px\">Invite someone<\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:14px;line-height:1.5;color:#666D89\">They receive an email invitation and must verify their identity before the portal opens.<\u002Fp>\n            <input value=\"{{ inviteEmail }}\" sc-camel-on-change=\"{{ onInvite }}\" placeholder=\"Email address\" style=\"width:100%;border:1px solid #e6eaec;border-radius:9px;padding:11px 13px;font-family:inherit;font-size:15px;color:#13384B;background:#fafcfd\">\n            <input value=\"{{ inviteRel }}\" sc-camel-on-change=\"{{ onInviteRel }}\" placeholder=\"Relationship to Noreen\" style=\"width:100%;border:1px solid #e6eaec;border-radius:9px;padding:11px 13px;font-family:inherit;font-size:15px;color:#13384B;background:#fafcfd;margin-top:9px\">\n            <div style=\"font-size:12.5px;font-weight:600;letter-spacing:.05em;color:#666D89;text-transform:uppercase;margin:15px 0 9px\">Access level<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <sc-for list=\"{{ accessLevels }}\" as=\"a\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ a.go }}\" style=\"border:1px solid {{ a.bd }};background:{{ a.bg }};color:{{ a.fg }};cursor:pointer;font:500 13.8px Prompt,sans-serif;padding:9px 14px;border-radius:20px;white-space:nowrap\">{{ a.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.5;color:#666D89;margin-top:11px\">{{ levelHint }}<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;margin-top:15px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ sendInvite }}\" style=\"border:none;cursor:pointer;background:#13384B;color:#fff;font:500 14.7px Prompt,sans-serif;padding:11px 18px;border-radius:9px\">Send invitation<\u002Fbutton>\n              <span style=\"font-size:13px;color:#005D63;font-weight:600\">{{ inviteStatus }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section style=\"background:#fff;border:1px solid #e6eaec;border-radius:14px;box-shadow:0 1px 2px rgba(19,56,75,.04);padding:22px\">\n            <div style=\"font:600 16px Prompt,sans-serif;margin-bottom:12px\">What each level allows<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:13px\">\n              <sc-for list=\"{{ levelRules }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div>\n                  <div style=\"font-size:14px;font-weight:700\">{{ r.label }}<\u002Fdiv>\n                  <div style=\"font-size:14px;line-height:1.5;color:#666D89;margin-top:3px\">{{ r.text }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isNotify }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:660px\">\n\n        <section style=\"background:#fff;border:1px solid #e6eaec;border-radius:14px;box-shadow:0 1px 2px rgba(19,56,75,.04);padding:22px;min-width:0\">\n          <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n            <div style=\"min-width:200px;flex:1\">\n              <div style=\"font:600 17px Prompt,sans-serif\">Notifications<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.55;color:#666D89;margin-top:4px\">Be told when there is a new visit update, a flagged concern or a change to Noreen's care plan.<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ notifGo }}\" aria-label=\"Notifications\" style=\"width:52px;height:30px;border-radius:20px;border:none;cursor:pointer;padding:0;position:relative;flex:none;background:{{ notifTrack }}\">\n              <span style=\"position:absolute;top:4px;left:{{ notifKnob }};width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(19,56,75,.25)\"><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ notifOn }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:22px;padding-top:20px;border-top:1px solid #e6eaec\">\n              <div style=\"font-size:12.5px;font-weight:600;letter-spacing:.05em;color:#666D89;text-transform:uppercase;margin-bottom:12px\">Send them by<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ methods }}\" as=\"m\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{ m.go }}\" style=\"text-align:left;cursor:pointer;border:1px solid {{ m.border }};background:{{ m.bg }};border-radius:11px;padding:15px 17px;display:flex;align-items:flex-start;gap:13px;width:100%\">\n                    <span style=\"width:19px;height:19px;border-radius:50%;border:2px solid {{ m.dot }};background:{{ m.fill }};flex:none;margin-top:2px\"><\u002Fspan>\n                    <span style=\"min-width:0\">\n                      <span style=\"display:block;font:600 15.5px Prompt,sans-serif;color:#13384B\">{{ m.label }}<\u002Fspan>\n                      <span style=\"display:block;font-size:14px;line-height:1.55;color:#666D89;margin-top:3px\">{{ m.desc }}<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ isPhone }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:16px;border:1px solid #f5e2cf;background:#fdf7f0;border-radius:11px;padding:17px 19px\">\n                  <div style=\"font:600 15px Prompt,sans-serif;color:#b6650f;margin-bottom:7px\">The app is needed for phone alerts<\u002Fdiv>\n                  <div style=\"font-size:14px;line-height:1.55;color:#b6650f\">Install allways with you on your phone and sign in with this email.<\u002Fdiv>\n                  <div style=\"display:flex;gap:12px;margin-top:15px;flex-wrap:wrap\">\n                    <a href=\"#\" aria-label=\"Download on the App Store\"><img src=\"bd2e5593-3bba-4480-8c57-f1da4e625716\" alt=\"Download on the App Store\" style=\"height:44px;width:132px;display:block\"><\u002Fa>\n                    <a href=\"#\" aria-label=\"Get it on Google Play\"><img src=\"a1027ac4-b5f0-49e1-bdb9-30a4d8e94598\" alt=\"Get it on Google Play\" style=\"height:44px;width:148px;display:block\"><\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ notifOff }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:20px;padding-top:20px;border-top:1px solid #e6eaec;font-size:14px;line-height:1.55;color:#666D89\">You will not be contacted. Visit updates are still here in the portal whenever you want to look.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsection>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n   <\u002Fdiv>\n  <\u002Fmain>\n\n  <footer style=\"background:#13384B\">\n    <div class=\"gutter\" style=\"max-width:1320px;margin:0 auto;padding:34px 26px;display:flex;align-items:flex-start;gap:30px;flex-wrap:wrap\">\n      <div style=\"min-width:240px\">\n        <img src=\"2437a9f2-270c-45bc-8870-305010175648\" alt=\"allways with you\" style=\"height:38px;width:auto;display:block\">\n        <div style=\"font-size:14px;line-height:1.55;color:rgba(255,255,255,.85);margin-top:14px;max-width:340px\">Transforming Care Plan Management for Home Care Providers<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;margin-left:auto\">\n        <a href=\"#\" style=\"font-size:14.5px;color:rgba(255,255,255,.85)\">Privacy Policy<\u002Fa>\n        <a href=\"#\" style=\"font-size:14.5px;color:rgba(255,255,255,.85)\">Terms &amp; Conditions<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { hasPhoto: false, editingPhoto: false, tab: 'updates',\n    notifOn: true, method: 'email', noteText: '', noteStatus: '', noteKind: 'Observation', period: '180', flaggedOnly: false, inviteEmail: '', inviteRel: '', inviteLevel: 'View only', inviteStatus: '' };\n\n  go(t) { return () => this.setState({ tab: t }); }\n\n  renderVals() {\n    const s = this.state;\n    const tabDef = [['updates', 'Visit updates', null], ['plan', 'Care plan', null], ['docs', 'Support docs', 6], ['people', \"Noreen's Circle\", 4], ['notify', 'Notifications', null]];\n    const tabs = tabDef.map(([id, label, count]) => ({\n      label, count, go: this.go(id),\n      fg: s.tab === id ? '#13384B' : '#666D89',\n      bd: s.tab === id ? '#51BF9D' : 'transparent'\n    }));\n\n    const today = new Date(2026, 7, 26);\n    const raw = [\n      ['2026-08-25', 'A nice bowl of porridge this morning and a small orange, plus her meds. Got her all dressed up for her day out. All good.'],\n      ['2026-08-24', 'Less than half a bowl of porridge, a pear, meds taken. Back later for the dinner — she had near enough half of it with a cup of tea and a cookie. Good form.', 'Appetite', 'Eating less than usual at breakfast for a second day. Being watched, nothing needed from you.'],\n      ['2026-08-11', 'A nice bowl of porridge and a pear this morning, plus meds. She did not eat much of her dinner. In great form.'],\n      ['2026-08-10', 'Just up when Helena arrived. A nice bowl of porridge and a pear, meds taken. At the second call she had a good bit of dinner, currant bread and tea, and a little dance.'],\n      ['2026-07-23', 'Up and dressed, did not want the shower. Half a bowl of porridge, a peach and her meds, then a cup of tea. In good form. Helena returned in the afternoon to give her the dinner.', 'Feeling weak', 'Third morning feeling a bit weak in herself. Public health nurse visited on 22 July.'],\n      ['2026-07-22', 'Felt a little weak again this morning. Meds taken, half a bowl of porridge, a peach and a cup of tea. The public health nurse came at lunchtime. A yogurt and tea after that, and she was in great form.'],\n      ['2026-07-21', 'Just up when Helena arrived. She felt breathless getting to the door. Took her meds, had a nice bowl of porridge, a pear and a cup of tea, and was much better by the time Helena left.', 'Breathlessness', 'Raised with the care coordinator. Public health nurse arranged for Wednesday lunchtime.'],\n      ['2026-07-20', 'About half a bowl of porridge and a pear, plus tea. Meds taken. In good form but very tired in herself. A yogurt and a cup of tea at lunchtime.'],\n      ['2026-07-17', 'Gone to mass with a neighbour when Helena called. Willie had given her the morning meds. Very tired in herself and would only take an ensure drink. Dinner left in the oven.'],\n      ['2026-06-26', 'She took a bit of a weakness at mass. A neighbour brought her home and she was very pale and a bit confused. She ate a little and had a cup of tea, then an ensure drink. Her colour had come back and she was feeling better by the time Helena left.', 'Weakness and confusion', 'Reported the same day. GP review arranged and family contacted.'],\n      ['2026-06-25', 'Shower this morning, most of her porridge and a kiwi, meds taken. The power was out so she had a big orange and her ensure drink at lunchtime. No walk, too hot.'],\n      ['2026-06-24', 'Finished her porridge with a plum, meds taken. On the walk she said her back was at her, so they turned back. An ensure drink before Helena left.'],\n      ['2026-06-18', 'Great form as always. Shower this morning. A small bit of a rash on her right leg next to the ankle, cream applied. A nice bowl of porridge and fruit, meds taken.', 'Skin', 'Cream applied and the area kept under review. No pain or soreness reported.'],\n      ['2026-06-09', 'Up and dressed. Less than half a bowl of porridge and a pear. Meds taken. A slice of cake and a cup of tea at lunchtime.', 'Medication', 'Two lots of tablets were out on the counter. Helena sorted them. Family have moved the tablets out of reach.'],\n      ['2026-06-08', 'In great form. She ate all her porridge and took her meds. No walking, but a few dances around the house. Back brace on and dinner in the oven.'],\n      ['2026-05-19', 'In great form this morning. Did not eat much breakfast, meds and drink taken. A cup of tea at lunchtime and her dinner in the oven. A lovely singsong.'],\n      ['2026-05-18', 'Not feeling herself this morning. Only a few spoons of porridge, and no mind for tea and toast either. Meds taken.', 'Appetite', 'Recorded and passed to the coordinator. Watched over the following calls.'],\n      ['2026-05-13', 'A good breakfast this morning and meds taken. Busy changing the bed and hoovering, with a singsong afterwards. All good.'],\n      ['2026-04-29', 'Not a great breakfast, meds taken. Dinner in the oven. No walking, so a cuppa and a good singsong instead.', 'Skin', 'Scratching at the side of her knee, looked like a few hives. Calamine lotion applied and family asked to check it.'],\n      ['2026-04-28', 'Not a great breakfast this morning, meds taken, but in mighty form. A cup of tea at lunchtime and her dinner left in the oven.'],\n      ['2026-04-21', 'A good breakfast this morning plus her meds. A short walk, under protest, and a waltz afterwards.'],\n      ['2026-03-11', 'Porridge, fruit and tablets in the morning. She did not finish it but had a good bit. Very pale looking but in good spirits.', 'Appearance', 'Pallor noted and passed to the coordinator.'],\n      ['2026-02-12', 'Found in a weak state in the afternoon, confused and agitated, perspiring and heated. Helena got her seated and stayed on an extra hour until she had fully recovered and was eating and having a cup of tea.', 'Weak episode', 'Family contacted the same day. Bloods and a GP check-up booked for the following week.']\n    ];\n    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];\n    const periodDef = [['30', '30 days', 30], ['180', '6 months', 180], ['all', 'All', 99999]];\n    const periods = periodDef.map(([id, label]) => ({\n      label, go: () => this.setState({ period: id }),\n      bg: s.period === id ? '#fff' : 'transparent',\n      fg: s.period === id ? '#13384B' : '#666D89'\n    }));\n    const days = (periodDef.find(p => p[0] === s.period) || periodDef[1])[2];\n    const items = raw\n      .map(([iso, text, flag, flagNote]) => {\n        const d = new Date(iso);\n        return { d, iso, text, flag: flag || null, flagNote: flagNote || null, carer: 'Helena O.',\n          date: d.getDate() + ' ' + months[d.getMonth()].slice(0, 3),\n          ago: Math.round((today - d) / 86400000) };\n      })\n      .filter(u => u.ago <= days && (!s.flaggedOnly || u.flag));\n    const groups = [];\n    items.forEach(u => {\n      const key = months[u.d.getMonth()] + ' ' + u.d.getFullYear();\n      let g = groups.find(x => x.label === key);\n      if (!g) { groups.push(g = { label: key, items: [] }); }\n      g.items.push(u);\n    });\n    groups.forEach(g => {\n      const f = g.items.filter(i => i.flag).length;\n      g.meta = g.items.length + (g.items.length === 1 ? ' visit' : ' visits') + (f ? ' · ' + f + ' flagged' : '');\n    });\n    const flagged = items.filter(i => i.flag).length;\n    const resultCount = items.length\n      ? items.length + (items.length === 1 ? ' visit' : ' visits') + ' shown' + (flagged ? ', ' + flagged + ' with something flagged' : '')\n      : 'No visits match this filter.';\n\n    return {\n      hasPhoto: s.hasPhoto, initialsMode: !s.hasPhoto,\n      editingPhoto: s.editingPhoto,\n      photoCta: s.hasPhoto ? 'Change photo' : 'Add a photo',\n      togglePhoto: () => this.setState(p => ({ editingPhoto: !p.editingPhoto })),\n      photoHint: s.photoHint,\n      avatarImg: s.photoUrl ? React.createElement('img', { src: s.photoUrl, alt: 'Noreen Curtin', style: { width: 56, height: 56, borderRadius: 14, objectFit: 'cover', display: 'block' } }) : null,\n      draftImg: s.draftPhoto ? React.createElement('img', { src: s.draftPhoto, alt: 'Selected photo', style: { width: '100%', height: '100%', objectFit: 'cover', display: 'block' } }) : null,\n      draftPhoto: s.draftPhoto || null,\n      noDraftPhoto: !s.draftPhoto,\n      chooseLabel: s.draftPhoto ? 'Choose a different photo' : 'Choose a photo',\n      onPhotoFile: e => {\n        const file = e.target.files && e.target.files[0];\n        if (!file) return;\n        const reader = new FileReader();\n        reader.onload = ev => {\n          const img = new Image();\n          img.onload = () => {\n            const S = 256, c = document.createElement('canvas');\n            c.width = S; c.height = S;\n            const side = Math.min(img.width, img.height);\n            c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);\n            this.setState({ draftPhoto: c.toDataURL('image/jpeg', 0.85), photoHint: '' });\n          };\n          img.src = ev.target.result;\n        };\n        reader.readAsDataURL(file);\n      },\n      donePhoto: () => {\n        if (s.draftPhoto) this.setState({ editingPhoto: false, hasPhoto: true, photoUrl: s.draftPhoto, photoHint: '' });\n        else this.setState({ photoHint: 'Choose a photo first, or press Cancel to keep the initials.' });\n      },\n      cancelPhoto: () => this.setState({ editingPhoto: false, photoHint: '', draftPhoto: s.photoUrl || null }),\n      usInitials: () => this.setState({ editingPhoto: false, hasPhoto: false, photoHint: '' }),\n      tabs,\n      isUpdates: s.tab === 'updates', isPlan: s.tab === 'plan', isDocs: s.tab === 'docs', isPeople: s.tab === 'people', isNotify: s.tab === 'notify',\n\n\n      notifOn: s.notifOn, notifOff: !s.notifOn,\n      notifTrack: s.notifOn ? '#51BF9D' : '#d7dee1',\n      notifKnob: s.notifOn ? '26px' : '4px',\n      notifGo: () => this.setState(p => ({ notifOn: !p.notifOn })),\n      isPhone: s.notifOn && s.method === 'phone',\n      methods: [\n        ['email', 'Email', 'To katiecurtin@gmail.com.'],\n        ['phone', 'Phone alert', 'Arrives in seconds. Needs the app installed on your phone.']\n      ].map(([k, label, desc]) => {\n        const on = s.method === k;\n        return { label, desc, border: on ? '#51BF9D' : '#e6eaec', bg: on ? '#f2fbf8' : '#fff',\n          dot: on ? '#51BF9D' : '#c3ced4', fill: on ? '#51BF9D' : 'transparent',\n          go: () => this.setState({ method: k }) };\n      }),\n      latestTags: [{ label: 'Ate well' }, { label: 'Meds taken' }, { label: 'Second call at 2pm' }],\n\n      periods, groups, resultCount, retentionNote: 'Visit updates are kept on Noreen\\u2019s record for seven years. The portal shows the last two years; older entries are available from the branch on request.',\n      toggleFlagged: () => this.setState(p => ({ flaggedOnly: !p.flaggedOnly })),\n      flaggedBg: s.flaggedOnly ? 'rgba(246,140,61,.14)' : '#fff',\n      flaggedBd: s.flaggedOnly ? 'rgba(246,140,61,.35)' : '#e6eaec',\n      flaggedFg: s.flaggedOnly ? '#b6650f' : '#666D89',\n\n      noteKinds: ['Observation', 'Concern'].map(k => ({\n        label: k, go: () => this.setState({ noteKind: k, noteStatus: '' }),\n        bg: s.noteKind === k ? (k === 'Concern' ? '#fdf1ef' : 'rgba(81,191,157,.10)') : '#fff',\n        bd: s.noteKind === k ? (k === 'Concern' ? '#f0d3cf' : 'rgba(81,191,157,.35)') : '#e6eaec',\n        fg: s.noteKind === k ? (k === 'Concern' ? '#8c3a30' : '#005D63') : '#666D89'\n      })),\n      noteHint: s.noteKind === 'Concern'\n        ? 'A concern is read by the coordinator the same working day and may prompt a call or a care plan review.'\n        : 'A
